<svg xmlns="http://www.w3.org/2000/svg" width="960" height="850" viewBox="0 0 960 850" role="img" aria-labelledby="title desc">
<title id="title">Eight Schools | Variational Difficulty Profile</title><desc id="desc">Radar plot of centered and non-centered fits after 3000 updates. Axis-specific visualization scaling, not calibrated scores.</desc>
<rect width="960" height="850" fill="white"/>
<g font-family="Arial, sans-serif" fill="#172333">
<text x="480" y="38" font-size="27" font-weight="bold" text-anchor="middle">Eight Schools | Variational Difficulty Profile</text>
<text x="480" y="69" font-size="17" text-anchor="middle">3,000 Adam updates per run · four MFVI fits per parameterization</text>
<circle cx="480" cy="420" r="61.25" fill="none" stroke="#cbd2d9" stroke-width="1.2"/><text x="509.4" y="363.325" font-size="12" fill="#53606d">0.25</text>
<circle cx="480" cy="420" r="122.5" fill="none" stroke="#cbd2d9" stroke-width="1.2"/><text x="538.8" y="310.65" font-size="12" fill="#53606d">0.50</text>
<circle cx="480" cy="420" r="183.75" fill="none" stroke="#cbd2d9" stroke-width="1.2"/><text x="568.2" y="257.975" font-size="12" fill="#53606d">0.75</text>
<circle cx="480" cy="420" r="245" fill="none" stroke="#cbd2d9" stroke-width="1.2"/><text x="597.6" y="205.3" font-size="12" fill="#53606d">1.00</text>
<line x1="480" y1="420" x2="480.00" y2="175.00" stroke="#cbd2d9"/>
<line x1="480" y1="420" x2="713.01" y2="344.29" stroke="#cbd2d9"/>
<line x1="480" y1="420" x2="624.01" y2="618.21" stroke="#cbd2d9"/>
