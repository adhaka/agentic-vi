[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-vi"
version = "0.1.0"
description = "A reproducible research scaffold for autonomous variational inference discovery"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "numpy>=1.24"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agentic_vi*"]

[project.optional-dependencies]
vdp = ["arviz==0.21.0", "scipy==1.15.3"]
